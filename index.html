<body data-tool="equation-solver">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Equation Solver</h1>
    <p>Enter the coefficients and get exact answers (fractions and square roots, not just decimals) with the working shown. Coefficients can be whole numbers, decimals or fractions like 3/4.</p>
  </section>

  <div class="seg es-tabs" id="tabs" role="group" aria-label="Equation type">
    <button type="button" data-v="lin" aria-pressed="false">Linear</button>
    <button type="button" data-v="quad" aria-pressed="true">Quadratic</button>
    <button type="button" data-v="cubic" aria-pressed="false">Cubic</button>
    <button type="button" data-v="sys2" aria-pressed="false">2 × 2 system</button>
    <button type="button" data-v="sys3" aria-pressed="false">3 × 3 system</button>
  </div>

  <section class="card mt">
    <div class="row between">
      <h2 id="formTitle">Equation</h2>
      <div class="row">
        <button class="btn ghost small" type="button" id="example">Example</button>
        <button class="btn ghost small" type="button" id="clear"><svg class="i"><use href="#i-trash"/></svg>Clear</button>
      </div>
    </div>
    <div id="form" class="eq-form" dir="ltr"></div>
    <p class="faint eq-p" id="preview" dir="ltr"></p>
  </section>

  <div class="eq-grid mt">
    <section class="card">
      <div class="row between">
        <h2>Solution</h2>
        <button class="btn ghost small" type="button" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
      </div>
      <div id="result" class="eq-result" aria-live="polite"></div>
    </section>
    <section class="card">
      <h2>Steps</h2>
      <ol id="steps" class="eq-steps"></ol>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
